baseURL = "https://rdegges.com"
# There are no list templates, so Hugo could not write HTML for these kinds and
# logged "found no layout file" for each. It still gave them an HTML permalink,
# which put 41 URLs in sitemap.xml that 404 -- every /YYYY/, /tags/*, and
# /categories/. Their only rendered output was a feed nothing linked to.
disableKinds = ["section", "taxonomy", "term"]
enableRobotsTXT = true
ignoreLogs = ['warning-goldmark-raw-html']
locale = "en-us"
newContentEditor = "nvim"
timezone = "America/Los_Angeles"
title = "Randall Degges"

[module]
# The OLDEST Hugo these layouts work with -- deliberately not the version we
# pin. 0.146 introduced the template layout used here and 0.158 added
# .Language.Locale (0.157 fails to build, 0.158 succeeds). This only moves if
# the templates start using a newer feature, so upgrading Hugo never touches
# this file. Older versions log a clear incompatibility warning up front
# instead of a pile of template errors.
[module.hugoVersion]
min = "0.158.0"

[imaging]
# Hugo's default resample filter is "box", which is fast but soft when
# downscaling. Lanczos is the quality choice and these images are resized once
# at build time, so the cost is paid in CI rather than by readers.
resampleFilter = "lanczos"

[imaging.jpeg]
# Resizing re-encodes, so this is the quality every downscaled JPEG inherits.
# Hugo defaults to 75; measured on this site's photos, 85 scores ~90 on
# SSIMULACRA2 (visually lossless) while 75 is visibly softer.
quality = 85

[services]
  [services.rss]
    # The feed carried all 168 posts in full: 2,077,488 bytes, and every
    # aggregator refetched the lot on every poll. Twenty items is the RSS
    # convention and cuts it to 366,729 bytes -- and because posts here are
    # infrequent, twenty still reaches back to December 2015.
    #
    # Items stay full-content rather than becoming summaries, so the feed is
    # still readable without visiting the site.
    limit = 20

[params]
description = "The personal website of Randall Degges: programmer, speaker, author and entrepreneur."
email = "r@rdegges.com"
subtitle = "Random Thoughts of a Happy Programmer"
emailSubscriptionFormAction = "https://buttondown.com/api/emails/embed-subscribe/rdegges"

[[params.navLinks]]
title = "Bluesky"
url = "https://bsky.app/profile/rdegges.com"

[[params.navLinks]]
title = "GitHub"
url = "https://github.com/rdegges"

[[params.navLinks]]
title = "Talks"
url = "https://speakerdeck.com/rdegges"

[[params.navLinks]]
title = "Email"
url = "mailto:r@rdegges.com"

[params.author]
name = "Randall Degges"
email = "r@rdegges.com"

# Atom 1.0 instead of RSS 2.0, at the same /feed.xml URL so existing
# subscribers keep working -- readers parse the document, not the extension.
# Hugo has no built-in Atom media type, so it is declared here.
[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.Atom]
    mediaType = "application/atom+xml"
    baseName = "feed"
    isPlainText = false
    rel = "alternate"

  # /llms.txt (https://llmstxt.org): a plain-text map of the site for AI
  # systems, rendered from layouts/home.llms.txt.
  [outputFormats.LLMs]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

  # Each post as Markdown at <post>/index.md, rendered from
  # layouts/page.markdown.md and advertised with <link rel="alternate">, so
  # AI crawlers can read the text without scraping the HTML around it.
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    rel = "alternate"

  # RFC 9116 security.txt, rendered from layouts/home.securitytxt.txt so its
  # required Expires date is computed at build time rather than going stale.
  [outputFormats.SecurityTxt]
    mediaType = "text/plain"
    baseName = "security"
    path = ".well-known"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "Atom", "LLMs", "SecurityTxt"]
  page = ["HTML", "Markdown"]

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
hl_Lines = ''
hl_inline = false
lineAnchors = ''
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = false
noHl = false
style = 'autumn'
tabWidth = 4

# Who this site is about, for the structured data in _partials/schema.html.
# sameAs tells search engines and AI systems that these profiles belong to
# the same person as this site, which is how they tie it all to one entity.
[params.person]
jobTitle = "VP, AI Engineering"
worksFor = "Snyk"
worksForURL = "https://snyk.io"
sameAs = [
  "https://github.com/rdegges",
  "https://bsky.app/profile/rdegges.com",
  "https://www.linkedin.com/in/rdegges/",
  "https://www.instagram.com/randalldegges",
  "https://speakerdeck.com/rdegges",
]
