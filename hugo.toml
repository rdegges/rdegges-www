baseURL = "https://rdegges.com"
enableRobotsTXT = true
ignoreLogs = ['warning-goldmark-raw-html']
locale = "en-us"
newContentEditor = "nvim"
timezone = "America/Los_Angeles"
title = "Randall Degges"

[module]
# Declares the Hugo version the layouts are written against. Building with
# anything older logs "Module "project" is not compatible with this Hugo
# version" up front, which is a much clearer signal than the template errors
# that follow. It is a warning, not a hard stop -- scripts/check-hugo-version.sh
# is what actually fails the build in CI.
[module.hugoVersion]
min = "0.165.0"

[permalinks]
post = "/:year/:title"

[params]
description = "The personal website of Randall Degges: programmer, speaker, author and entrepreneur."
email = "r@rdegges.com"
subtitle = "Random Thoughts of a Happy Programmer"
emailSubscriptionFormAction = "https://buttondown.email/api/emails/embed-subscribe/rdegges"

[[params.navLinks]]
title = "Bluesky"
url = "https://bsky.app/profile/rdegges.com"

[[params.navLinks]]
title = "GitHub"
url = "https://github.com/rdegges"

[[params.navLinks]]
title = "Talks"
url = "https://speakerdeck.com/rdegges"

[[params.navLinks]]
title = "Email"
url = "mailto:r@rdegges.com"

[params.author]
name = "Randall Degges"
email = "r@rdegges.com"

[outputFormats.RSS]
baseName = "feed"

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
hl_Lines = ''
hl_inline = false
lineAnchors = ''
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = false
noHl = false
style = 'autumn'
tabWidth = 4
