# Temporary: proves that a failed scheduled run emails the owner, who last
# changed this cron line. Remove this file once one "Run failed" email for
# it has arrived.
name: Schedule failure probe

on:
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

jobs:
  fail:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail on purpose
        run: exit 1
