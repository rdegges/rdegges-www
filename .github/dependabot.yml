# Keeps the build toolchain current so upgrades arrive as small, reviewable PRs
# instead of piling up. Hugo itself is pinned in three files that must move
# together, so a Docker bump here will fail CI until hugo.toml and render.yaml
# are updated to match — see scripts/check-hugo-version.sh.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
