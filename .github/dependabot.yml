# Keeps the build toolchain current so upgrades arrive as small, reviewable PRs
# instead of piling up. The Hugo version is the image tag in
# docker-compose.yml, and CI fails on any Hugo warning, so a Hugo bump that
# would break the site fails on its own PR.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release. Compromised and broken
    # releases are usually caught and pulled within days; this keeps them
    # from reaching the build in the meantime.
    cooldown:
      default-days: 7
    # One PR for all minor and patch action bumps in a given week instead of
    # one each. Majors stay separate PRs so each gets its own review.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor and patch Hugo bumps are grouped; a Hugo major stays its own PR.
    groups:
      hugo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  # cf and wrangler, the Cloudflare packaging tools CI runs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # cf requires a minimum wrangler version, so the two move in one PR. A
      # PR that bumps only one of them fails CI. cf is a prerelease (1.0.0-beta.N),
      # which an update-types filter of minor and patch does not match, so this
      # group has no update-types filter. It is listed first because a package
      # joins the first group it matches.
      cloudflare:
        patterns: ["cf", "wrangler"]
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
