# Docker Compose for local Hugo development
# Usage: docker compose up
#
# This image tag is the single source of truth for the Hugo version.
# Production reads it too: scripts/render-build.sh parses the version out of
# this file, so a Dependabot bump here upgrades local dev, CI and Render at once.

services:
  hugo:
    image: hugomods/hugo:base-0.165.0
    container_name: rdegges-www
    ports:
      - "1313:1313"
    volumes:
      - .:/src
    working_dir: /src
    # Enable live reload by polling (works better with Docker on macOS)
    command: hugo server --bind 0.0.0.0 --buildDrafts --buildFuture --poll 500ms
