# Docker Compose for local Hugo development
# Usage: docker compose up
#
# The Hugo version here must match hugo.toml and render.yaml.
# Run scripts/check-hugo-version.sh (or `make check`) to verify.

services:
  hugo:
    image: hugomods/hugo:base-0.165.0
    container_name: rdegges-www
    ports:
      - "1313:1313"
    volumes:
      - .:/src
    working_dir: /src
    # Enable live reload by polling (works better with Docker on macOS)
    command: hugo server --bind 0.0.0.0 --buildDrafts --buildFuture --poll 500ms
