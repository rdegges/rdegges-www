{{- /* No JavaScript: target="popupwindow" already opens Buttondown's
       confirmation page in a new tab. The onsubmit that used to pre-open
       that window was the only script on the site. */ -}}
<form
    action="{{ .Site.Params.emailSubscriptionFormAction }}"
    class="email-subscribe form-inline"
    method="post"
    role="form"
    target="popupwindow"
>
    <div class="form-group">
        <input
            class="form-control"
            name="email"
            placeholder="Email Address"
            size="20"
            required
            type="email"
        />
    </div>
    <button type="submit" class="btn btn-primary">Subscribe</button>
</form>
